{id:"sa",n:"1 · Strategic & Intuitive",
al:"Strand: <b>Understanding Local Networks</b> (critical thinking skills). Competency: distinguish and apply strategic analysis and intuitive thinking in decision-making.",
h:[["Strategic analysis","Deliberate, abstract, effortful thinking that breaks a complex problem into parts. <b>Time and resources</b> are the primary factors."],
["5 steps (Arzadon, 2018)","<table><tr><th>Step</th><th>Meaning</th></tr><tr><td>1 Identify</td><td>Define the problem and its factors/conditions</td></tr><tr><td>2 Analyze</td><td>Examine variables, challenges and causes</td></tr><tr><td>3 Generate</td><td>Set practical, reasonable, creative criteria and strategies</td></tr><tr><td>4 Implement</td><td>Execute the plan</td></tr><tr><td>5 Assess &amp; Reflect</td><td>Draw lessons for future decisions</td></tr></table>"],
["5 components of strategic planning (Urgel, 2017)","<table><tr><th>Component</th><th>People called</th></tr><tr><td>Committed people (management, officers, stakeholders)</td><td><b>Engagers</b></td></tr><tr><td>Long-term strategic objectives</td><td><b>Aimers</b></td></tr><tr><td>Strategic alternatives (brainstorming, SWOT)</td><td>—</td></tr><tr><td>Evaluation &amp; choice of strategies</td><td><b>Option generators</b></td></tr><tr><td>Monitoring of implementation</td><td><b>Strategizers</b></td></tr></table><p class='note'>SWOT = Strengths, Weaknesses, Opportunities, Threats.</p>"],
["Intuitive thinking","Knowing/deciding without proof or rational process: hunch, gut feeling. Spontaneous, unplanned, quick and broad evaluation. Good intuition comes from <b>long years of knowledge and experience</b>. Best when facts are insufficient and past decisions are unavailable.<ul><li>Mental attributes: unconscious, implicit, automatic, low effort, rapid, experiential, impulsive, shared with animals</li><li>Functional: practical, concrete, parallel, heuristic, holistic, independent of general intelligence</li></ul>"],
["Habits of highly intuitive people (Gregoire, 2014)","<ul><li>Listen to the inner voice</li><li>Take time alone to reflect (mindfulness = observing experience without judgement)</li><li>Listen to their bodies</li><li>Observe everything (coincidences, odd things)</li><li>Pay attention to dreams (unconscious thinking)</li><li>Connect deeply with others, stay positive</li></ul>"],
["Strategic vs intuitive","<table><tr><th></th><th>Strategic</th><th>Intuitive</th></tr><tr><td>Process</td><td>Deliberate, effortful</td><td>Spontaneous, automatic</td></tr><tr><td>Basis</td><td>Facts, data, context</td><td>Hunches, experience</td></tr><tr><td>Use when</td><td>Complex problem, time available</td><td>Facts lacking, quick decision</td></tr></table>"]]},
{id:"lb",n:"2 · Labor",
al:"Strand: <b>Understanding Global Networks</b> (labor). Competency: explain the global labor network and the role of international organizations in protecting workers.",
h:[["Global network – labour","Interconnected system of international organizations, agreements, cross-border businesses, trade unions and regulatory frameworks that govern, protect and structure how work is performed globally. Labor rights = human rights. Hub: <b>Geneva</b>. Goal: <b>full and productive employment and decent work for all</b>."],
["5 core pillars of international labour standards","<ul><li><b>Freedom of association</b> &amp; collective bargaining</li><li><b>Elimination of forced labour</b> (modern slavery, trafficking)</li><li><b>Abolition of child labour</b></li><li><b>Non-discrimination</b> (gender, race, ethnicity, religion, social origin)</li><li><b>Safe and healthy working environment</b></li></ul>"],
["Emerging challenges","<ul><li><b>Platform economy</b>: new income but no formal benefits, algorithmic management, transparency issues</li><li><b>Protection of labour migrants</b>: vulnerable to exploitation and trafficking; needs ILO + IOM coordination</li><li><b>Global supply chains</b>: long chains hide abuses; hard to end forced/child labor, ensure living wages</li><li><b>AI &amp; technology</b>: may disrupt up to <b>1 in 4 jobs</b>; needs upskilling and regulation</li></ul>"],
["Key milestones / actions","<ul><li><b>Platform economy regulation</b>: Decent Work in the Platform Economy Convention (fair pay, social protection, automated-decision transparency)</li><li><b>Just transition</b>: green transitions must not penalize workers</li><li><b>Corporate accountability &amp; due diligence</b>: enforce living wages, safe conditions</li></ul>"],
["Key organizations","<table><tr><th>Org</th><th>Role</th></tr><tr><td>ILO</td><td>UN agency: governments + employers + workers set labor standards</td></tr><tr><td>IOM</td><td>Humane, orderly migration; safeguards migrant workers</td></tr><tr><td>UNCTAD, UNECE, World Bank Group, UN Global Compact</td><td>Mobilize private-sector compliance with labor principles</td></tr></table>"]]},
{id:"mg",n:"3 · Migration",
al:"Strand: <b>Global Networks</b> (migration). Competency: explain causes and types of migration and its link to globalization.",
h:[["Definitions","<b>Globalization</b>: movement of capital, free flow of goods/services, mobility of individuals, growth of multinational corporations and transnational organizations; goal: interdependence.<br><b>Migration</b>: movement of people from one territory to another to take up permanent or temporary residence. Demand for laborers in capitalist countries pushed families from unprivileged communities to migrate. About <b>20%</b> of the Philippine labor force wants to work abroad; some become victims of illegal recruitment and human trafficking."],
["4 categories of reasons","Environmental · Political · Cultural · Economic"],
["Push and pull (National Geographic)","<table><tr><th>Push (leave)</th><th>Pull (attract)</th></tr><tr><td>Difficult living conditions, persecution, unemployment, war/unrest, poverty, lack of jobs, corruption, bad education</td><td>Affordable housing, good economic prospects, good weather, safe streets, good schools/hospitals, family and friends, culture venues</td></tr></table>"],
["5 types of migration","<ol><li><b>Internal</b>: new residence within own country/state/continent</li><li><b>External</b>: to a different country/state/continent</li><li><b>Emigration</b>: leaving one country to move to another (slide says \"Migration\")</li><li><b>Immigration</b>: moving into a new country</li><li><b>Forced</b>: state/authorities force people to move</li></ol>"],
["Migration & climate change","Achim Steiner (IUCN): migration, forced or otherwise, will be one of the most significant consequences of environmental degradation and climate change. <b>250 million</b> permanently displaced by floods, droughts, famines, hurricanes (per slides). <b>Climate refugees</b> migrate because of disaster, not war or conflict. \"Placelessness\" harms self-identity and well-being."]]},
{id:"cc",n:"4 · Climate Change",
al:"Strand: <b>Planetary Networks</b>. Competency: explain climate change as a global issue, its causes, effects and solutions.",
h:[["Climate change vs global warming","<b>Climate change</b>: long-term changes in Earth’s temperature and weather patterns; today mainly human-caused (fossil fuels, deforestation, greenhouse gases).<br><b>Global warming</b>: long-term heating of Earth’s surface since pre-industrial period (<b>1850–1900</b>) due to human activities, mainly fossil fuel burning. <i>Not interchangeable</i> with climate change."],
["Why a global issue","Human activities raise greenhouse gases → trap heat → affects all countries → global cooperation is necessary."],
["Consumption & production","<b>Consumption</b> = using goods/services; <b>production</b> = making goods/providing services. Factories need energy; burning fossil fuels and transport release emissions; higher demand → more production → more emissions.<br>Harmful practices: wasting electricity/food, excessive fuel vehicles, unnecessary buying, plastic waste, deforestation without restoration."],
["Effects","<ul><li><b>Environment</b>: extreme heat, changing rainfall/flood risk, rising sea levels, ecosystem stress</li><li><b>Nature &amp; agriculture</b>: coral bleaching, habitat loss, drought and flood damage to crops, threatened food security</li><li><b>People &amp; economy</b>: health problems, damaged homes/roads, lost business income, higher food prices, vulnerable communities at greater risk</li></ul>"],
["Solutions","<ul><li><b>Individual</b>: reduce-reuse-recycle, save electricity/water, protect forests, walk/cycle/public transport, avoid waste</li><li><b>Collective</b>: enforce environmental laws, clean energy, disaster preparedness, early-warning systems, climate education</li><li>Individuals cannot solve it alone: governments, businesses, communities must cooperate</li></ul>"]]},
{id:"di",n:"5 · Democratic Intervention",
al:"Strand: <b>Understanding Global Networks</b> (democratic intervention &amp; ICT). Competency: explain democratic participation and how ICT supports it.",
h:[["Key terms","<b>Government intervention</b>: how a government regulates activities of individuals/organizations in its jurisdiction (positive or negative effects).<br><b>Democratic participation</b>: empowering people to help create structures and design policies and programs that serve everyone; requires association with others."],
["6 fundamental elements of modern democracy","<ol><li><b>Rule of law</b>: no one above the law, equal before the law</li><li><b>Separation of powers</b>: checks and balances among executive, legislative, judiciary</li><li><b>Basic rights and freedom</b>: human, civil, political</li><li><b>Suffrage</b>: right to vote regardless of sex, religion, party, education, status</li><li><b>Freedom of speech</b>: limits = <b>libel</b> (malicious published harm to character), <b>oral defamation</b> (spoken lies)</li><li><b>Pluralism</b>: different beliefs/organizations (e.g. administration vs opposition)</li></ol>"],
["Types of rights","<b>Human</b>: belongs to every person (life, security, live freely). <b>Civil</b>: own property, citizen privileges. <b>Political</b>: protect freedom from infringement by government (run for office, suffrage)."],
["Types of democracy","<table><tr><th></th><th>Direct (pure)</th><th>Indirect (representative)</th></tr><tr><td>How</td><td>Citizens vote on issues/laws</td><td>People elect representatives</td></tr><tr><td>Example</td><td>Swiss cantons; PH initiative &amp; referendum</td><td>Vote executive and legislators</td></tr><tr><td>Pro</td><td>Every citizen has a voice</td><td>Easier to decide and implement</td></tr><tr><td>Con</td><td>Hard with huge populations</td><td>Hard to know everyone’s will</td></tr></table>"],
["4 dimensions of democracy","The People · Equality (legal/moral, equal right to rule and vote) · Common Good (well-being of all, not a particular majority) · Representation."],
["Political corruption & participation","44 of 47 countries said the conditions of a good society were not met. Causes of dissatisfaction: failure to meet <b>basic needs</b>, to protect from economic change, to involve citizens. Undemocratic practices weaken family/kinship bonds. Citizens participate via <b>collective action</b> (voluntary work) and <b>political processes</b>."],
["ICT essentials","<b>ICT</b>: tools and processes to access, retrieve, store, organize, manipulate, produce, present, exchange information. <b>Digital divide</b>: gap in access and skills to ICT.<br>Functions: data capture, storage, transmission (LAN, WAN, MAN), processing, manipulation, retrieval, display. Two converging technologies: <b>computation</b> and <b>communication</b>.<br>Dates: telephone 1876 (Bell) · wireless telegraph 1894 (Marconi) · first microprocessor 1971 (Intel) · IBM computers 1981 · World Wide Web 1991."]]}
];

const X={sa:[["📝 Worked example: choosing a SHS strand","<ol><li><b>Identify</b>: I can’t decide between STEM and ABM.</li><li><b>Analyze</b>: grades, interests, cost, career paths, causes of my doubt.</li><li><b>Generate</b>: options (STEM, ABM, switch later), criteria (interest, jobs), SWOT.</li><li><b>Implement</b>: enroll in the chosen strand.</li><li><b>Assess &amp; Reflect</b>: after one semester, did it fit? Adjust next time.</li></ol>"],["💡 When to use which?","<b>Strategic</b>: big, complex, costly decisions with time and data (school budget, business plan). <b>Intuitive</b>: urgent or data-poor moments (a nurse senses a patient is getting worse; a teacher feels the class is lost). Intuition is not random: it is <i>stored experience</i>. A beginner’s gut feeling is weaker than an expert’s. Best decisions often combine both: gut to spot, analysis to check."]],
lb:[["🇵🇭 Pillars in real life","<ul><li><b>Association</b>: workers can form or join a union without being fired for it.</li><li><b>Forced labour</b>: workers recruited with fake promises, passports held, cannot leave (human trafficking).</li><li><b>Child labour</b>: children working in dangerous jobs instead of school; solved by poverty reduction and free education, not only by laws.</li><li><b>Non-discrimination</b>: equal pay and hiring regardless of gender, race, religion.</li><li><b>Safety</b>: protective gear, safe buildings, rest periods.</li></ul>"],["📱 Why the new challenges matter","<ul><li><b>Platform workers</b> (e.g. delivery riders, freelancers) are often called “partners”, so they may lack minimum wage, insurance and a say when an algorithm lowers their pay.</li><li><b>Supply chains</b>: a shirt may pass through 5 countries; the company can’t see the farm or factory at the bottom, so abuses hide. <b>Due diligence</b> = actively checking and fixing.</li><li><b>AI</b>: some jobs vanish, others change; <b>upskilling</b> keeps workers employable.</li><li><b>Just transition</b>: coal workers moving to renewable jobs should get retraining, not unemployment.</li></ul>"]],

cc:[["🌪️ Why it hits the Philippines hard","Located on typhoon belt with long coastlines, so sea-level rise, stronger storms and floods hit many communities. Poorer, coastal and farming communities are <b>most vulnerable</b> because they have fewer resources to recover. This links back to migration: lost homes and farms → displacement."],["🔄 Cause → effect chain","Higher demand → more factories and transport → more fossil fuel burning → more greenhouse gases → heat trapped → warmer oceans, droughts, floods → crop loss → higher food prices and displacement. <b>Break the chain</b> at any link: buy less waste, use clean energy, protect forests (trees absorb carbon)."]],
di:[["🏛️ Rights and limits, with examples","<ul><li><b>Human right</b>: right to life. <b>Civil right</b>: owning property. <b>Political right</b>: voting, running for office.</li><li>Freedom of speech lets you criticize the government, but <b>not</b> publish false, malicious claims (libel) or spread spoken lies (oral defamation).</li><li><b>Pluralism</b>: ruling party and opposition can disagree and both are legitimate.</li></ul>"],["📶 Democracy, corruption and ICT","Corruption and failure to meet basic needs make citizens lose trust. Citizens respond by <b>collective action</b> (volunteering) and <b>political participation</b> (voting, joining groups). ICT helps by sharing government information, enabling online discussion and reporting, and speeding up services. But the <b>digital divide</b> (no device, signal or skills) can leave poor and rural citizens out, so access must be addressed."]]};

const TC={
sa:[["🧠","Strategic analysis",["Deliberate","Effortful","Parts of a problem","Time & resources"],"Let us start with strategic analysis. It is slow, deliberate thinking. You take a big, complex problem and break it into smaller parts, always looking at its context. The two main limits are the amount of time and the resources you have.","What are the primary factors?","Time and resources."],
["🪜","The 5 steps (Arzadon)",["Identify","Analyze","Generate","Implement","Assess & Reflect"],"Here are the five steps in order. One, Identify the problem and its conditions. Two, Analyze the variables and causes. Three, Generate practical, creative strategies and criteria. Four, Implement the plan. Five, Assess and Reflect, so you learn for future decisions. Picture choosing between STEM and ABM, and walk through each step.","Which step comes right after Analyze?","Generate."],
["👥","5 components (Urgel)",["Engagers","Aimers","SWOT alternatives","Option generators","Strategizers"],"Strategic planning has five components. Committed people are the engagers. Those who set long-term objectives are the aimers. Next come strategic alternatives, found through brainstorming and SWOT, which means Strengths, Weaknesses, Opportunities, Threats. Option generators evaluate and choose. Strategizers monitor the implementation.","Who implements and monitors?","Strategizers."],
["💭","Intuitive thinking",["Gut feeling","Experience","Quick","Unplanned"],"Now the other way of deciding. Intuitive thinking is knowing without proof. It is a hunch, a gut feeling. It is fast, automatic and low effort. But it is not random. It comes from long years of knowledge and experience, which is why a nurse can sense a patient is getting worse. It works best when facts are insufficient.","Why is an expert’s gut stronger than a beginner’s?","It is built from stored experience."],
["🌙","Habits of intuitive people",["Inner voice","Alone time","Body","Observe","Dreams","Connect"],"According to Gregoire, highly intuitive people have habits. They listen to their inner voice, take quiet time to reflect, which is mindfulness, listen to their bodies, observe coincidences and odd things, pay attention to dreams, and connect deeply with others while staying positive.","Mindfulness means…","Observing experience without judgement."],
["⚖️","Strategic vs intuitive",["Facts & data","Hunches","Complex + time","Facts lacking"],"Compare them. Strategic is deliberate and uses facts and data, so use it for complex problems when you have time. Intuitive is spontaneous and uses hunches and experience, so use it when facts are lacking and you must decide fast. The best decisions combine both: gut to spot, analysis to check.","Urgent, little data: which one?","Intuitive."]],
lb:[["🌐","The global labour network",["ILO","IOM","Unions","Geneva","Decent work"],"The global labour network is a connected system of international organizations, agreements, cross-border businesses, trade unions and regulations. Together they govern and protect how work is done worldwide. It is anchored in Geneva. Remember: labor rights are human rights, and the goal is full and productive employment and decent work for all.","Where is the hub?","Geneva."],
["🏛️","5 core pillars",["Association","No forced labour","No child labour","Non-discrimination","Safe work"],"Memorize five pillars. Freedom of association and collective bargaining, so you can join a union without being fired. Elimination of forced labour, like trafficking and held passports. Abolition of child labour. Non-discrimination by gender, race, religion or origin. And a safe and healthy workplace, with protective gear and safe buildings.","A worker is fired for joining a union. Which pillar?","Freedom of association."],
["📱","Emerging challenges",["Platform economy","Migrants","Supply chains","AI"],"There are four emerging challenges. Platform workers, like delivery riders, get income but lack formal benefits and face algorithmic management. Labour migrants are vulnerable to exploitation and trafficking. Global supply chains are so long that abuses hide. And AI may disrupt up to one in four jobs, so workers need upskilling.","Which challenge hides child labour two countries away?","Global supply chains."],
["🛠️","Key actions",["Platform convention","Just transition","Due diligence"],"Here are the responses. First, regulate the platform economy with the Decent Work in the Platform Economy Convention: fair pay, social protection and transparent automated decisions. Second, a just transition, so green change never penalizes workers. Third, corporate accountability and due diligence, which means actively enforcing living wages and safe conditions, not just having a policy.","Coal workers retrained for solar jobs show…","A just transition."],
["🏢","Key organizations",["ILO","IOM","UNCTAD · UNECE","World Bank","UN Global Compact"],"Know who does what. The ILO is the UN agency where governments, employers and workers together set labor standards. The IOM promotes humane, orderly migration and safeguards migrant workers. UNCTAD, UNECE, the World Bank Group and the UN Global Compact mobilize the private sector to follow labor principles.","Who sets labor standards?","The ILO."]],
mg:[["🧳","What is migration?",["Movement","Permanent or temporary","Globalization"],"Migration is the movement of people from one territory to another to take up permanent or temporary residence. It is tied to globalization, which is the free flow of capital, goods, services and people. Demand for laborers in capitalist countries pulled families from poorer communities. About twenty percent of the Filipino labor force wants to work abroad, and some become victims of illegal recruitment and trafficking.","Globalization’s goal is…","Interdependence."],
["🧲","Reasons: push and pull",["Environmental","Political","Cultural","Economic","Push","Pull"],"There are four categories of reasons: environmental, political, cultural and economic. National Geographic sorts them as push and pull. Push factors make people leave: war, persecution, unemployment, poverty, corruption. Pull factors attract them: good jobs, affordable housing, safe streets, good schools and hospitals, family and friends.","Few local jobs and high wages abroad. Which is push, which is pull?","Few jobs = push. High wages = pull."],
["🗺️","5 types of migration",["Internal","External","Emigration","Immigration","Forced"],"Five types. Internal: a new home inside your own country. External: a different country. Emigration is leaving a country. Immigration is moving into a new country. Forced migration is when the state or authorities make people move. Note the slide says Migration for leaving, but the correct term is emigration.","A Filipino nurse settles in Canada. For the Philippines, it is…","Emigration."],
["🔎","How to classify a move",["Crossed border?","Real choice?","Push or pull?"],"Use three questions. One, did the person cross a country border? No means internal, yes means external. Two, did the person have a real choice? If they could not refuse, it is forced, even if they were paid. Three, what pushed or pulled them: environmental, political, cultural or economic?","Government orders you out. Voluntary?","No, it is forced."],
["🌊","Migration and climate change",["Climate refugees","Disaster","250 million","Placelessness"],"Achim Steiner said migration will be one of the most significant consequences of climate change. The slides say 250 million are permanently displaced by floods, droughts, famines and hurricanes. Climate refugees move because of disaster, not war or conflict. Losing home brings placelessness, which harms self-identity and well-being.","Climate refugees flee…","Disaster, not war."],
["⚖️","Benefits and costs",["Remittances","Skills","Brain drain","Trafficking"],"Migration has two sides. Benefits are jobs, higher income, remittances sent home, skills and cultural exchange. Costs are family separation, brain drain when skilled people leave, exploitation, illegal recruitment, trafficking and discrimination.","What is brain drain?","Skilled people leaving their country."]],
cc:[["🌡️","Climate change vs global warming",["Long-term","Human caused","1850–1900"],"Climate change is the long-term change in Earth’s temperature and weather patterns, mainly human caused today through fossil fuels, deforestation and greenhouse gases. Global warming is narrower: the long-term heating of Earth’s surface since the pre-industrial period, 1850 to 1900. They are not interchangeable. Warming is one part of climate change.","Warming is measured since…","1850 to 1900."],
["🌍","Why it is a global issue",["Greenhouse gases","Trapped heat","All countries","Cooperation"],"Human activities raise greenhouse gases. These trap heat, and the effects cross borders and touch every country. That is why global cooperation is necessary. No single nation can fix it alone.","Why not only local?","Gases and effects cross borders."],
["🏭","Consumption and production",["Energy","Fossil fuels","Transport","Waste"],"Consumption is using goods and services. Production is making them. Factories need energy, burning fossil fuels releases emissions, and transport adds more. Higher demand means more production and more emissions. Harmful practices include wasting electricity and food, plastic waste, unnecessary buying and cutting forests without restoration. Follow the chain: demand, factories, fossil fuels, gases, trapped heat, then floods, drought and crop loss.","Leaving lights on all day does what?","Raises energy demand and emissions."],
["🌊","Effects",["Heat","Sea rise","Coral bleaching","Crop loss","Prices"],"The effects hit three areas. The environment: extreme heat, changing rainfall, rising seas. Nature and agriculture: coral bleaching from warmer oceans, habitat loss, drought and flood damage to crops, and threatened food security. People and the economy: health problems, damaged homes and roads, lost income and higher food prices. Poor, coastal and farming communities suffer most, and the Philippines sits on the typhoon belt.","Warmer oceans cause…","Coral bleaching."],
["🌱","Solutions",["Reduce · Reuse · Recycle","Public transport","Laws","Clean energy","Early warning"],"Solutions work at two levels. Individuals reduce, reuse and recycle, save electricity and water, protect forests, and walk, cycle or take public transport. Collectively, we enforce environmental laws, use clean energy, prepare for disasters, build early-warning systems and teach climate education. Individuals cannot solve it alone, so governments, businesses and communities must cooperate.","Early-warning systems are…","Collective action."]],
di:[["🏛️","Key terms",["Government intervention","Democratic participation","Association"],"Two key terms. Government intervention is how a government regulates the activities of individuals and organizations in its jurisdiction, with positive or negative effects. Democratic participation is empowering people to help create structures and design policies and programs that serve everyone. It requires association with others.","Participation requires…","Association with others."],
["⚖️","6 elements of modern democracy",["Rule of law","Separation of powers","Basic rights","Suffrage","Free speech","Pluralism"],"Six elements. Rule of law: no one is above the law. Separation of powers: checks and balances among the executive, legislative and judiciary. Basic rights and freedom. Suffrage: the right to vote regardless of sex, religion, party, education or status. Freedom of speech, limited by libel, which is published, and oral defamation, which is spoken. And pluralism: different beliefs and organizations, like administration versus opposition.","Court cancels an unconstitutional law. Which element?","Separation of powers."],
["🗳️","Types of rights",["Human","Civil","Political"],"Three types of rights. Human rights belong to every person: life, security, living freely. Civil rights are citizen privileges, like owning property. Political rights protect freedom from government infringement, like running for office and suffrage.","Voting is which right?","Political."],
["🤝","Direct vs indirect democracy",["Direct","Indirect","The People","Equality","Common Good","Representation"],"In direct democracy, citizens vote on issues and laws. Examples are Swiss cantons and the Philippine initiative and referendum. Every citizen has a voice, but it is hard with huge populations. In indirect democracy, people elect representatives. It is easier to decide, but hard to know everyone’s will. The four dimensions are the people, equality, common good and representation.","Electing senators is…","Indirect democracy."],
["📉","Corruption and participation",["Basic needs","Trust","Collective action","Political process"],"Political corruption and failure to meet basic needs make citizens dissatisfied. In the study, 44 of 47 countries said the conditions of a good society were not met. People are also not protected from economic change or involved in policy. Citizens respond through collective action, like volunteer work, and through political processes, like voting and joining groups.","Volunteering to clean a creek is…","Collective action."],
["📡","ICT and the digital divide",["ICT","Computation","Communication","Digital divide"],"ICT means the tools and processes to access, store, organize, produce and exchange information. Its functions are capture, storage, transmission, processing, retrieval and display, built on two converging technologies, computation and communication. Remember dates: telephone 1876, wireless telegraph 1894, microprocessor 1971, IBM computers 1981, World Wide Web 1991. The digital divide is the gap in access and skills.","No signal means students can’t study online. This is…","The digital divide."]]};
